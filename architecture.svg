<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Helvetica, Arial, sans-serif">
<title>Dead-Zone Field Manual architecture</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5b73"/></marker></defs>
<rect width="1200" height="640" fill="#fafbfc"/>
<text x="600" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#1a2433">Offline extrusion-line troubleshooter on the Dragonwing IQ-9075</text>
<rect x="10" y="48" width="1050" height="510" rx="16" fill="none" stroke="#7b8794" stroke-width="2" stroke-dasharray="8 6"/>
<text x="22" y="70" font-size="14" fill="#5b6b7f">Qualcomm IQ-9075 EVK: Ubuntu 24.04, Hexagon v73 NPU (2 NSP cores), 8 CPU cores. Fully offline, Wi-Fi off.</text>
<text x="205" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#4a7fb5">INPUTS</text>
<text x="530" y="620" text-anchor="middle" font-size="14" fill="#3b4a5e">Measured: d1 decision ~0.47 s | Omni first text 0.8 s on NPU (3.5 s CPU) | explanation + box ~8 s</text>
<rect x="30" y="110" width="250" height="100" rx="10" fill="#e8f1fb" stroke="#4a7fb5" stroke-width="2"/><text x="155.0" y="138" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2433">USB webcam / mock feed</text><text x="155.0" y="162" text-anchor="middle" font-size="14" fill="#3b4a5e">camd.sh: latest frame</text><text x="155.0" y="182" text-anchor="middle" font-size="14" fill="#3b4a5e">mock_feed.sh: demo stills</text><rect x="30" y="300" width="250" height="100" rx="10" fill="#e8f1fb" stroke="#4a7fb5" stroke-width="2"/><text x="155.0" y="328" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2433">Plantronics speakerphone mic</text><text x="155.0" y="352" text-anchor="middle" font-size="14" fill="#3b4a5e">voice-activity endpointing</text><text x="155.0" y="372" text-anchor="middle" font-size="14" fill="#3b4a5e">mute button = push-to-talk</text><rect x="380" y="80" width="300" height="110" rx="10" fill="#fff3dc" stroke="#c98a1b" stroke-width="2"/><text x="530.0" y="108" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2433">Decision: Liquid d1-2B (NPU)</text><text x="530.0" y="132" text-anchor="middle" font-size="14" fill="#3b4a5e">ZETIC Ixian Hexagon SDK 0.2.2</text><text x="530.0" y="152" text-anchor="middle" font-size="14" fill="#3b4a5e">zetic_d1_cli serve, JSONL stdio</text><text x="530.0" y="172" text-anchor="middle" font-size="14" fill="#3b4a5e">frame vs GOOD image: ~0.47 s</text><rect x="380" y="250" width="300" height="150" rx="10" fill="#e6f5e9" stroke="#3b8d4f" stroke-width="2"/><text x="530.0" y="278" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2433">Generative: LFM3-Omni-2B Q4_0</text><text x="530.0" y="302" text-anchor="middle" font-size="14" fill="#3b4a5e">llama.cpp b12323 ggml-hexagon (NPU)</text><text x="530.0" y="322" text-anchor="middle" font-size="14" fill="#3b4a5e">llama-server 127.0.0.1:18080</text><text x="530.0" y="342" text-anchor="middle" font-size="14" fill="#3b4a5e">image+audio+text in; explanation,</text><text x="530.0" y="362" text-anchor="middle" font-size="14" fill="#3b4a5e">bbox_2d, card; STT and TTS</text><rect x="380" y="450" width="300" height="90" rx="10" fill="#f1e9f8" stroke="#7a52a3" stroke-width="2"/><text x="530.0" y="478" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2433">Knowledge base (local)</text><text x="530.0" y="502" text-anchor="middle" font-size="14" fill="#3b4a5e">defects.json: 17 defects</text><text x="530.0" y="522" text-anchor="middle" font-size="14" fill="#3b4a5e">line.json: Z1-Z12 -> manual cards</text><rect x="790" y="80" width="250" height="70" rx="10" fill="#fdeaea" stroke="#b5524a" stroke-width="2"/><text x="915.0" y="108" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2433">ffmpeg red box</text><text x="915.0" y="132" text-anchor="middle" font-size="14" fill="#3b4a5e">drawn on the frame</text><rect x="790" y="180" width="250" height="70" rx="10" fill="#fdeaea" stroke="#b5524a" stroke-width="2"/><text x="915.0" y="208" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2433">Speakerphone speaks step</text><text x="915.0" y="232" text-anchor="middle" font-size="14" fill="#3b4a5e">/v1/audio/speech</text><rect x="790" y="280" width="250" height="70" rx="10" fill="#fdeaea" stroke="#b5524a" stroke-width="2"/><text x="915.0" y="308" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2433">JSONL log</text><text x="915.0" y="332" text-anchor="middle" font-size="14" fill="#3b4a5e">logs/field-manual.jsonl</text><rect x="790" y="380" width="250" height="90" rx="10" fill="#fdeaea" stroke="#b5524a" stroke-width="2"/><text x="915.0" y="408" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2433">Dashboard display.py</text><text x="915.0" y="432" text-anchor="middle" font-size="14" fill="#3b4a5e">127.0.0.1:8765  /monitor</text><text x="915.0" y="452" text-anchor="middle" font-size="14" fill="#3b4a5e">verdict, box, text, timings</text><rect x="870" y="560" width="300" height="60" rx="10" fill="#eef0f3" stroke="#7b8794" stroke-width="2"/><text x="1020.0" y="588" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2433">Laptop browser</text><text x="1020.0" y="612" text-anchor="middle" font-size="14" fill="#3b4a5e">SSH tunnel or USB-C link</text><path d="M280,150 L380,130" stroke="#4a5b73" stroke-width="2.2" fill="none" marker-end="url(#a)"/><path d="M280,170 L380,290" stroke="#4a5b73" stroke-width="2.2" fill="none" marker-end="url(#a)"/><path d="M280,350 L380,330" stroke="#4a5b73" stroke-width="2.2" fill="none" marker-end="url(#a)"/><path d="M530,450 L530,400" stroke="#4a5b73" stroke-width="2.2" fill="none" marker-end="url(#a)"/><path d="M680,135 L790,115" stroke="#4a5b73" stroke-width="2.2" fill="none" marker-end="url(#a)"/><path d="M680,290 L790,215" stroke="#4a5b73" stroke-width="2.2" fill="none" marker-end="url(#a)"/><path d="M680,330 L790,315" stroke="#4a5b73" stroke-width="2.2" fill="none" marker-end="url(#a)"/><path d="M680,360 L790,420" stroke="#4a5b73" stroke-width="2.2" fill="none" marker-end="url(#a)"/><path d="M680,150 L790,400" stroke="#4a5b73" stroke-width="2.2" fill="none" marker-end="url(#a)"/><path d="M915,470 L1000,560" stroke="#4a5b73" stroke-width="2.2" fill="none" marker-end="url(#a)"/>
